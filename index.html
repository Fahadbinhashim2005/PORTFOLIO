<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahad Hashim - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- PHASE 1: LANDING SECTION -->
    <!-- 1. LANDING PAGE -->
    <header class="landing-section" id="home">
        <nav class="navbar">
            <div class="logo">Portfolio</div>
            <div class="logo">FH</div>
        </nav>
        
        <div class="landing-content">
            <h1 class="landing-title">Fahad Bin<br>Hashim;</h1>
        </div>

        <div class="landing-image-container">
            <img src="./images/hero-img.png" alt="Fahad Portrait" class="landing-img">
        </div>

        <div class="landing-footer">
            <div class="socials">
                <a href="#">LinkedIn</a>
                <a href="#">GitHub</a>
                <a href="#">Instagram</a>
            </div>
            
            <div class="footer-right">
                <div class="roles">
                    <span>// Full-Stack Developer</span>
                    <span>Computer Science Engineer</span>
                </div>
                
                <div class="scroll-indicator">
                    <span>SCROLL</span>
                </div>
            </div>
        </div>
    </header>

    <main class="dark-hero" id="about">
        
        <div class="hero-grid"></div>
        <div class="hero-spotlight left-spotlight"></div>
        <div class="hero-spotlight right-spotlight"></div>

        <nav class="hero-navbar">
            <div class="logo">Portfolio</div>
            
            <ul class="hero-nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Work</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            
            <div class="logo">FH</div>
        </nav>

        <div class="hero-content-wrapper">
            
            <div class="hero-text-side">
                
                <div class="hero-pill">
                    <span class="pill-dot"></span> Available for Freelance Work
                </div>
                
                <h1 class="hero-main-title">
                    Hey I'm <br>
                    <span class="text-gradient">Fahad...</span>
                </h1>
                
                <h2 class="hero-dynamic-subtitle">
                    I'm a <span id="dynamic-text" class="dynamic-text"></span><span class="cursor">|</span>
                </h2>
                
                <div class="hero-buttons-container">
                    <a href="./Fahad_Resume.pdf" download class="btn-primary-white">Download Resume</a>
                    <a href="#contact" class="btn-secondary-glass">Get in Touch</a>
                </div>

            </div>

            <div class="hero-3d-side">
                <script type="module" src="https://cdn.spline.design/@splinetool/viewer@2.0.36/build/spline-viewer.js"></script>
                <spline-viewer url="https://prod.spline.design/nWnVJ7EcLWpWW9qq/scene.splinecode"></spline-viewer>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
